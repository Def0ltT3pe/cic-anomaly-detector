name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall -q \
            App.py detector.py calibrate_model.py manage_users.py \
            make_checksums.py train_bruteforce.py train_model_v2.py \
            modules tests

      - name: Unit tests
        env:
          AUDIT_ENABLED: "0"
        run: python -m unittest discover -s tests -v
