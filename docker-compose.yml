services:
  anomaly-detector:
    build: .
    image: cic-anomaly-detector:latest
    container_name: cic_anomaly_detector
    ports:
      # По умолчанию только с этой машины; доступ по сети — APP_BIND=0.0.0.0
      # (тогда нужны пользователи или APP_PASSWORD и reverse proxy с TLS).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8501}:8501"
    environment:
      # Пустое значение = пояснения ИИ отключены, детекция работает.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # OpenAI-совместимый API; для Ollama на хосте — http://host.docker.internal:11434/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Без пользователей и APP_PASSWORD приложение не откроется; 1 — пускать
      # всех как admin без пароля (только для локальной проверки).
      ALLOW_OPEN_MODE: ${ALLOW_OPEN_MODE:-0}
      # models — рабочая модель, models_v2 — экспериментальная.
      MODEL_DIR: ${MODEL_DIR:-models}
      # Доп. модели для выбора в интерфейсе: путь внутри контейнера (см. volumes).
      MODELS_ROOT: ${MODELS_ROOT:-}
      # Свои адреса и подсети через запятую: из них инциденты не собираются.
      TRUSTED_IPS: ${TRUSTED_IPS:-}
      # 0 — отключить проверку SHA-256 моделей.
      VERIFY_MODEL_CHECKSUMS: ${VERIFY_MODEL_CHECKSUMS:-1}
    volumes:
      # users.json читается с хоста; без него нужен APP_PASSWORD (см. ALLOW_OPEN_MODE).
      - ./config:/app/config:ro
      # журнал аудита переживает перезапуск контейнера
      - audit_data:/app/audit
      # адаптированные модели с хоста; MODELS_ROOT=/app/extra_models
      # - ./extra_models:/app/extra_models:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  audit_data:
